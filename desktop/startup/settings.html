<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitals Desktop Settings</title>
<link rel="stylesheet" href="./startup.css">
<script src="./settings.js" defer></script>
<main class="settings">
  <h1 id="heading">Desktop mode</h1>
  <form autocomplete="off">
    <fieldset class="roles">
      <legend id="role-legend">Choose how Vitals runs</legend>
      <label><input type="radio" name="role" value="hub" checked> <span id="hub-label">Hub</span></label>
      <label><input type="radio" name="role" value="remote"> <span id="remote-label">Remote</span></label>
    </fieldset>
    <p id="description">Run the Vitals service and keep data on this computer.</p>
    <fieldset id="remote" class="connection" aria-label="Remote hub connection" disabled hidden>
      <label id="url-label" for="url">Hub HTTPS address</label>
      <input id="url" name="url" type="url" maxlength="2048" placeholder="https://vitals.example.com" spellcheck="false" required>
      <label id="token-label" for="token">Pairing token</label>
      <input id="token" name="token" type="password" maxlength="4096" autocomplete="new-password" spellcheck="false">
    </fieldset>
    <p id="feedback" class="feedback" role="alert"></p>
    <button id="save" type="submit" disabled>Save and apply</button>
  </form>
</main>
</html>
